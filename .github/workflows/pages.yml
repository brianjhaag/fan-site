# The web link: this repo as it is, to GitHub Pages, on every push (Nov 4 2026: the built-in branch deploy got stuck in its queue).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fan-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # 30 minutes, not the default 10: 0.63.4's two deploys were cut off at 10, the second just as its files finished syncing (Nov 6 2026)
