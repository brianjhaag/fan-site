<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fan</title>
<meta name="description" content="Every NFL game on one page: live scores, injuries, edges, schedules and telecasts. Nothing to install.">
<style>html,body{margin:0;background:#1a1f26;color:#e8ebef;font:16px system-ui,sans-serif}p{margin:40px 16px}a{color:#5fd0a6}</style></head><body>
<p id="note">Opening Fan…</p>
<script>
(async () => {
  try {
    const p = await (await fetch("current.json?t=" + Date.now(), { cache: "no-store" })).json();
    if (!/^\d+\.\d+\.\d+$/.test(p.release || "")) throw new Error("the site names no release");
    location.replace("r/" + p.release + "/" + location.search + location.hash);
  } catch (e) { const n = document.getElementById("note"); n.textContent = "Fan couldn't open (" + e.message + "). "; const a = document.createElement("a"); a.href = location.href; a.textContent = "Try again"; n.append(a); }
})();
</script><noscript><p>Fan needs JavaScript.</p></noscript></body></html>
